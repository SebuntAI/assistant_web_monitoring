[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-web-monitoring"
version = "0.1.0"
description = "Web activity monitoring for the Assistant application"
requires-python = ">=3.11"

[project.scripts]
assistant-web-monitoring = "assistant_web_monitoring.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["assistant_web_monitoring*"]
